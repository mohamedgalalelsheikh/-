<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>حجز موعد - د. محمد جلال الشيخ</title>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap');
  body { font-family: 'IBM Plex Sans Arabic', 'Tajawal', sans-serif; }
  .pulse-line { animation: pulseMove 3.5s linear infinite; }
  @keyframes pulseMove { 0% { stroke-dashoffset: 240; } 100% { stroke-dashoffset: 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { animation: spin 1s linear infinite; }
</style>
</head>
<body class="bg-stone-50">
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

/* -------------------------------------------------
   تخزين المواعيد المحجوزة (localStorage)
   ملاحظة مهمة: هذا التخزين محلي في متصفح كل زائر لوحده.
   يعني الموقع شغال فورًا من غير أي إعداد إضافي، لكن لو مريضين
   حجزوا نفس الميعاد من جهازين مختلفين مش هيتضاربوا تلقائيًا.
   لما يبقى عندك كمبيوتر تقدر تربط الموقع بقاعدة بيانات مشتركة
   (Google Sheets) عشان الحجز يبقى موحّد لكل المرضى.
------------------------------------------------- */
const storage = {
  async get(key) {
    const v = localStorage.getItem(key);
    if (v === null) return null;
    return { key, value: v };
  },
  async set(key, value) {
    localStorage.setItem(key, value);
    return { key, value };
  },
};

async function getBookedTimes(clinicId, dateStr) {
  const key = `slots_${clinicId}_${dateStr}`;
  const res = await storage.get(key);
  const list = res ? JSON.parse(res.value) : [];
  return list.map((b) => b.time);
}

async function bookSlot(payload) {
  const key = `slots_${payload.clinic}_${payload.date}`;
  const res = await storage.get(key);
  const list = res ? JSON.parse(res.value) : [];
  if (list.some((b) => b.time === payload.time)) {
    return { success: false, error: "taken" };
  }
  const code = `${payload.clinic.slice(0, 2).toUpperCase()}-${Date.now().toString().slice(-6)}`;
  list.push({ ...payload, code });
  await storage.set(key, JSON.stringify(list));
  return { success: true, code };
}

/* ------------------- أيقونات بسيطة ------------------- */
const Icon = ({ children, size = 18, className = "" }) => (
  <svg
    width={size}
    height={size}
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    strokeWidth="2"
    strokeLinecap="round"
    strokeLinejoin="round"
    className={className}
  >
    {children}
  </svg>
);
const UserIcon = (p) => <Icon {...p}><circle cx="12" cy="8" r="4" /><path d="M4 20c0-4 4-6 8-6s8 2 8 6" /></Icon>;
const PhoneIcon = (p) => <Icon {...p}><path d="M4 4c0 9 7 16 16 16l3-4-6-3-2 2c-2-1-4-3-5-5l2-2-3-6z" /></Icon>;
const MailIcon = (p) => <Icon {...p}><rect x="3" y="5" width="18" height="14" rx="2" /><path d="M3 7l9 6 9-6" /></Icon>;
const CalendarIcon = (p) => <Icon {...p}><rect x="3" y="5" width="18" height="16" rx="2" /><path d="M3 10h18M8 3v4M16 3v4" /></Icon>;
const ClockIcon = (p) => <Icon {...p}><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 3" /></Icon>;
const MapPinIcon = (p) => <Icon {...p}><path d="M12 22s7-7.5 7-12a7 7 0 10-14 0c0 4.5 7 12 7 12z" /><circle cx="12" cy="10" r="2.5" /></Icon>;
const CheckIcon = (p) => <Icon {...p}><circle cx="12" cy="12" r="9" /><path d="M8 12l3 3 5-6" /></Icon>;
const AlertIcon = (p) => <Icon {...p}><circle cx="12" cy="12" r="9" /><path d="M12 8v5M12 16h.01" /></Icon>;
const LoaderIcon = ({ size = 18, className = "" }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" className={"spin " + className}>
    <path d="M12 3a9 9 0 1 0 9 9" />
  </svg>
);

/* ------------------- بيانات العيادات ------------------- */
const CLINICS = [
  {
    id: "faisal",
    name: "عيادة فيصل",
    address: "منطقة فيصل، الجيزة",
    days: [6, 0, 1, 2, 3], // السبت، الأحد، الاثنين، الثلاثاء، الأربعاء
    start: "18:30",
    end: "21:00",
  },
  {
    id: "mohandessin",
    name: "عيادة المهندسين",
    address: "26 شارع جامعة الدول العربية، أعلى المترو، الدور الثالث",
    days: [0, 2, 3], // الأحد، الثلاثاء، الأربعاء
    start: "16:00",
    end: "18:00",
  },
];

const DAY_NAMES = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
const MONTH_NAMES = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];

function pad(n) { return String(n).padStart(2, "0"); }
function dateKey(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }

function generateSlots(start, end) {
  const slots = [];
  let [h, m] = start.split(":").map(Number);
  const [eh, em] = end.split(":").map(Number);
  while (h < eh || (h === eh && m < em)) {
    slots.push(`${pad(h)}:${pad(m)}`);
    m += 10;
    if (m >= 60) { m = 0; h += 1; }
  }
  return slots;
}

function nextAvailableDates(clinic, count = 14) {
  const out = [];
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  for (let i = 0; out.length < count && i < 60; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() + i);
    if (clinic.days.includes(d.getDay())) out.push(d);
  }
  return out;
}

const STEPS = ["البيانات", "العيادة", "الموعد", "التأكيد"];

function ClinicReservation() {
  const [step, setStep] = useState(0);
  const [patient, setPatient] = useState({ name: "", age: "", mobile: "", email: "" });
  const [errors, setErrors] = useState({});
  const [clinic, setClinic] = useState(null);
  const [selectedDate, setSelectedDate] = useState(null);
  const [selectedTime, setSelectedTime] = useState(null);
  const [bookedTimes, setBookedTimes] = useState([]);
  const [loadingSlots, setLoadingSlots] = useState(false);
  const [submitting, setSubmitting] = useState(false);
  const [bookingCode, setBookingCode] = useState(null);
  const [submitError, setSubmitError] = useState("");

  const dates = useMemo(() => (clinic ? nextAvailableDates(clinic) : []), [clinic]);
  const allSlots = useMemo(() => (clinic ? generateSlots(clinic.start, clinic.end) : []), [clinic]);

  useEffect(() => {
    if (!clinic || !selectedDate) return;
    let cancelled = false;
    setLoadingSlots(true);
    setSelectedTime(null);
    (async () => {
      try {
        const times = await getBookedTimes(clinic.id, dateKey(selectedDate));
        if (!cancelled) setBookedTimes(times);
      } catch (e) {
        if (!cancelled) setBookedTimes([]);
      } finally {
        if (!cancelled) setLoadingSlots(false);
      }
    })();
    return () => { cancelled = true; };
  }, [clinic, selectedDate]);

  function validatePatient() {
    const e = {};
    if (!patient.name.trim() || patient.name.trim().length < 3) e.name = "من فضلك اكتب الاسم كامل";
    const ageNum = Number(patient.age);
    if (!patient.age || isNaN(ageNum) || ageNum < 1 || ageNum > 120) e.age = "من فضلك اكتب سن صحيح";
    if (!/^01[0125][0-9]{8}$/.test(patient.mobile.trim())) e.mobile = "رقم الموبايل غير صحيح، مثال: 01012345678";
    if (patient.email.trim() && !/^\S+@\S+\.\S+$/.test(patient.email.trim())) e.email = "البريد الإلكتروني غير صحيح";
    setErrors(e);
    return Object.keys(e).length === 0;
  }

  async function confirmBooking() {
    setSubmitting(true);
    setSubmitError("");
    try {
      const result = await bookSlot({
        clinic: clinic.id,
        date: dateKey(selectedDate),
        time: selectedTime,
        name: patient.name.trim(),
        age: patient.age.trim(),
        mobile: patient.mobile.trim(),
        email: patient.email.trim(),
      });
      if (!result.success) {
        setSubmitError("للأسف هذا الموعد تم حجزه للتو، من فضلك اختر موعد آخر");
        const times = await getBookedTimes(clinic.id, dateKey(selectedDate));
        setBookedTimes(times);
        setSelectedTime(null);
        setSubmitting(false);
        return;
      }
      setBookingCode(result.code);
      setStep(3);
    } catch (e) {
      setSubmitError("حدث خطأ أثناء تأكيد الحجز، من فضلك تأكد من اتصال الإنترنت وحاول مرة أخرى");
    } finally {
      setSubmitting(false);
    }
  }

  function resetAll() {
    setStep(0);
    setPatient({ name: "", age: "", mobile: "", email: "" });
    setErrors({});
    setClinic(null);
    setSelectedDate(null);
    setSelectedTime(null);
    setBookedTimes([]);
    setBookingCode(null);
    setSubmitError("");
  }

  return (
    <div dir="rtl" className="min-h-screen bg-stone-50 flex items-start justify-center py-8 px-4">
      <div className="w-full max-w-md">
        <div className="text-center mb-6">
          <h1 className="text-2xl text-teal-900" style={{ fontFamily: "'Tajawal', sans-serif", fontWeight: 900 }}>
            حجز موعد
          </h1>
          <p className="text-stone-500 text-sm mt-1">د. محمد جلال الشيخ - استشاري المسالك البولية</p>
          <svg width="100%" height="20" viewBox="0 0 240 20" className="mx-auto mt-2 opacity-70">
            <polyline className="pulse-line" points="0,10 60,10 75,2 90,18 105,10 240,10" fill="none" stroke="#0f766e" strokeWidth="2" strokeDasharray="240" strokeLinecap="round" strokeLinejoin="round" />
          </svg>
        </div>

        {step < 3 && (
          <div className="flex items-center justify-between mb-6 px-2">
            {STEPS.slice(0, 3).map((label, i) => (
              <div key={label} className="flex-1 flex items-center">
                <div className="flex flex-col items-center flex-1">
                  <div className={`w-8 h-8 rounded-full flex items-center justify-center text-sm font-semibold ${i < step ? "bg-teal-700 text-white" : i === step ? "bg-teal-100 text-teal-800 ring-2 ring-teal-700" : "bg-stone-200 text-stone-400"}`}>
                    {i + 1}
                  </div>
                  <span className={`text-xs mt-1 ${i === step ? "text-teal-800 font-medium" : "text-stone-400"}`}>{label}</span>
                </div>
                {i < 2 && <div className={`h-0.5 flex-1 -mt-4 ${i < step ? "bg-teal-700" : "bg-stone-200"}`} />}
              </div>
            ))}
          </div>
        )}

        <div className="bg-white rounded-2xl shadow-sm border border-stone-200 p-5">
          {step === 0 && (
            <div className="space-y-4">
              <Field icon={<UserIcon size={18} />} label="الاسم بالكامل" value={patient.name} onChange={(v) => setPatient({ ...patient, name: v })} error={errors.name} placeholder="مثال: أحمد محمد علي" />
              <Field icon={<CalendarIcon size={18} />} label="السن" value={patient.age} onChange={(v) => setPatient({ ...patient, age: v.replace(/[^0-9]/g, "") })} error={errors.age} placeholder="مثال: 45" inputMode="numeric" />
              <Field icon={<PhoneIcon size={18} />} label="رقم الموبايل" value={patient.mobile} onChange={(v) => setPatient({ ...patient, mobile: v.replace(/[^0-9]/g, "") })} error={errors.mobile} placeholder="01012345678" inputMode="tel" />
              <Field icon={<MailIcon size={18} />} label="البريد الإلكتروني (اختياري)" value={patient.email} onChange={(v) => setPatient({ ...patient, email: v })} error={errors.email} placeholder="example@email.com" />
              <button onClick={() => validatePatient() && setStep(1)} className="w-full bg-teal-800 text-white rounded-xl py-3 font-semibold hover:bg-teal-900 transition-colors">
                التالي
              </button>
            </div>
          )}

          {step === 1 && (
            <div className="space-y-3">
              <p className="text-stone-600 text-sm mb-2">اختر مكان الكشف</p>
              {CLINICS.map((c) => (
                <button key={c.id} onClick={() => { setClinic(c); setSelectedDate(null); setSelectedTime(null); }}
                  className={`w-full text-right border rounded-xl p-3 flex items-start gap-3 transition-colors ${clinic?.id === c.id ? "border-teal-700 bg-teal-50" : "border-stone-200 hover:border-teal-300"}`}>
                  <MapPinIcon size={20} className="text-teal-700 mt-0.5 shrink-0" />
                  <div>
                    <div className="font-semibold text-stone-800">{c.name}</div>
                    <div className="text-xs text-stone-500 mt-0.5">{c.address}</div>
                    <div className="text-xs text-teal-700 mt-1">{c.days.map((d) => DAY_NAMES[d]).join(" - ")} | {c.start} - {c.end}</div>
                  </div>
                </button>
              ))}
              <div className="flex gap-2 pt-2">
                <button onClick={() => setStep(0)} className="flex-1 border border-stone-300 text-stone-600 rounded-xl py-3 font-semibold hover:bg-stone-50">رجوع</button>
                <button disabled={!clinic} onClick={() => setStep(2)} className="flex-1 bg-teal-800 text-white rounded-xl py-3 font-semibold hover:bg-teal-900 disabled:opacity-40 disabled:cursor-not-allowed">التالي</button>
              </div>
            </div>
          )}

          {step === 2 && clinic && (
            <div className="space-y-4">
              <div>
                <p className="text-stone-600 text-sm mb-2">اختر اليوم</p>
                <div className="flex gap-2 overflow-x-auto pb-1">
                  {dates.map((d) => {
                    const active = selectedDate && dateKey(d) === dateKey(selectedDate);
                    return (
                      <button key={dateKey(d)} onClick={() => setSelectedDate(d)}
                        className={`shrink-0 rounded-xl px-3 py-2 text-center border ${active ? "bg-teal-800 text-white border-teal-800" : "border-stone-200 text-stone-600 hover:border-teal-300"}`}>
                        <div className="text-xs">{DAY_NAMES[d.getDay()]}</div>
                        <div className="text-sm font-semibold">{d.getDate()} {MONTH_NAMES[d.getMonth()]}</div>
                      </button>
                    );
                  })}
                </div>
              </div>

              {selectedDate && (
                <div>
                  <p className="text-stone-600 text-sm mb-2 flex items-center gap-1">
                    <ClockIcon size={16} /> اختر الميعاد (كل موعد 10 دقايق)
                  </p>
                  {loadingSlots ? (
                    <div className="flex justify-center py-6 text-stone-400"><LoaderIcon size={22} /></div>
                  ) : (
                    <div className="grid grid-cols-4 gap-2">
                      {allSlots.map((t) => {
                        const taken = bookedTimes.includes(t);
                        const active = selectedTime === t;
                        return (
                          <button key={t} disabled={taken} onClick={() => setSelectedTime(t)}
                            className={`rounded-lg py-2 text-sm font-medium border relative ${taken ? "bg-stone-100 text-stone-300 border-stone-100 cursor-not-allowed line-through" : active ? "bg-amber-500 text-white border-amber-500" : "border-stone-200 text-stone-700 hover:border-teal-400"}`}>
                            {t}
                          </button>
                        );
                      })}
                    </div>
                  )}
                  {!loadingSlots && allSlots.every((t) => bookedTimes.includes(t)) && (
                    <p className="text-sm text-stone-500 text-center mt-2">كل المواعيد محجوزة في هذا اليوم، من فضلك اختر يوم تاني</p>
                  )}
                </div>
              )}

              <div className="flex gap-2 pt-2">
                <button onClick={() => setStep(1)} className="flex-1 border border-stone-300 text-stone-600 rounded-xl py-3 font-semibold hover:bg-stone-50">رجوع</button>
                <button disabled={!selectedTime} onClick={() => setStep(3.5)} className="flex-1 bg-teal-800 text-white rounded-xl py-3 font-semibold hover:bg-teal-900 disabled:opacity-40 disabled:cursor-not-allowed">التالي</button>
              </div>
            </div>
          )}

          {step === 3.5 && clinic && selectedDate && selectedTime && (
            <div className="space-y-4">
              <p className="text-stone-600 text-sm mb-1">راجع بيانات الحجز قبل التأكيد</p>
              <SummaryBlock patient={patient} clinic={clinic} date={selectedDate} time={selectedTime} />
              {submitError && (
                <div className="flex items-start gap-2 bg-red-50 text-red-700 text-sm rounded-lg p-3">
                  <AlertIcon size={16} className="mt-0.5 shrink-0" />
                  <span>{submitError}</span>
                </div>
              )}
              <div className="flex gap-2 pt-1">
                <button onClick={() => setStep(2)} className="flex-1 border border-stone-300 text-stone-600 rounded-xl py-3 font-semibold hover:bg-stone-50">تعديل</button>
                <button onClick={confirmBooking} disabled={submitting} className="flex-1 bg-teal-800 text-white rounded-xl py-3 font-semibold hover:bg-teal-900 disabled:opacity-60 flex items-center justify-center gap-2">
                  {submitting && <LoaderIcon size={18} />}
                  تأكيد الحجز
                </button>
              </div>
            </div>
          )}

          {step === 3 && clinic && selectedDate && selectedTime && (
            <div className="space-y-4 text-center">
              <CheckIcon size={48} className="mx-auto text-teal-700" />
              <div>
                <h2 className="text-lg font-bold text-teal-900">تم حجز الموعد بنجاح</h2>
                <p className="text-stone-500 text-sm mt-1">خد لقطة شاشة لهذه الصفحة أو احتفظ بكود الحجز</p>
              </div>
              <div className="bg-teal-50 rounded-xl py-2 text-teal-800 font-bold tracking-wide">كود الحجز: {bookingCode}</div>
              <SummaryBlock patient={patient} clinic={clinic} date={selectedDate} time={selectedTime} />
              <button onClick={resetAll} className="w-full border border-teal-700 text-teal-800 rounded-xl py-3 font-semibold hover:bg-teal-50">حجز موعد جديد</button>
            </div>
          )}
        </div>

        <p className="text-center text-xs text-stone-400 mt-4">لو عندك أي استفسار تواصل معنا واتساب على العيادة</p>
      </div>
    </div>
  );
}

function Field({ icon, label, value, onChange, error, placeholder, inputMode }) {
  return (
    <div>
      <label className="text-sm text-stone-600 mb-1 flex items-center gap-1.5">{icon}{label}</label>
      <input value={value} onChange={(e) => onChange(e.target.value)} placeholder={placeholder} inputMode={inputMode}
        className={`w-full border rounded-xl px-3 py-2.5 text-stone-800 outline-none focus:ring-2 ${error ? "border-red-300 focus:ring-red-200" : "border-stone-200 focus:ring-teal-200"}`} />
      {error && <p className="text-xs text-red-600 mt-1">{error}</p>}
    </div>
  );
}

function SummaryBlock({ patient, clinic, date, time }) {
  const rows = [
    ["الاسم", patient.name],
    ["السن", patient.age],
    ["الموبايل", patient.mobile],
    ...(patient.email.trim() ? [["البريد الإلكتروني", patient.email]] : []),
    ["العيادة", clinic.name],
    ["العنوان", clinic.address],
    ["اليوم", `${DAY_NAMES[date.getDay()]} ${date.getDate()} ${MONTH_NAMES[date.getMonth()]}`],
    ["الميعاد", time],
  ];
  return (
    <div className="bg-stone-50 rounded-xl p-4 text-sm divide-y divide-stone-200">
      {rows.map(([k, v]) => (
        <div key={k} className="flex justify-between py-1.5">
          <span className="text-stone-500">{k}</span>
          <span className="font-medium text-stone-800">{v}</span>
        </div>
      ))}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ClinicReservation />);
</script>
</body>
</html>
